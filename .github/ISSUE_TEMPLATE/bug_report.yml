name: Bug Report
description: Report a bug in GanaTrack
title: "fix(scope): description"
labels: ["bug", "status:needs-review"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checks
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I understand this issue needs status:approved before a PR can be opened
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug
      placeholder: Describe what is broken...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Numbered steps to reproduce the bug
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened
      placeholder: Describe the expected behavior...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (include errors/logs)
      placeholder: Describe what happened instead...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Where does this bug occur?
      options:
        - Backend (API)
        - Frontend (Web)
        - Database / Schema
        - Offline / PWA
        - Auth / Security
        - CI / Build
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any error output, console logs, or stack traces
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, workarounds, browser info, or anything else
      placeholder: Any extra context that helps...
